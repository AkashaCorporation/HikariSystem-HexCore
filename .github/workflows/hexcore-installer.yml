name: HexCore Build Installer

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag matching product.json (e.g., v3.8.4-rc.1)"
        required: true
        default: "v3.8.4-rc.1"
      build_linux:
        description: "Build the experimental Linux package"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  VSCODE_SKIP_NODE_VERSION_CHECK: 1
  npm_config_maxsockets: 8
  npm_config_loglevel: warn
  HEXCORE_RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

jobs:
  build-windows:
    name: Build Windows Installer
    # Pinned to windows-2022 (VS 2022). The windows-latest image moved to
    # Visual Studio 18 (2026), which node-gyp cannot detect ("unknown version
    # undefined found at ...\Visual Studio\18\Enterprise" + the vswhere
    # ERR_CHILD_PROCESS_STDIO_MAXB overflow), breaking native deps (tree-sitter)
    # during `cd build && npm ci`. Same fix that greened hexcore-native-prebuilds.
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"

      - name: Verify release identity
        run: node scripts/verify-hexcore-release.cjs

      - name: Test release identity
        run: node scripts/verify-hexcore-release.test.cjs

      - name: HexCore Preflight (Command/Build Coverage)
        run: node scripts/verify-hexcore-preflight.cjs

      - name: Test engine manifest
        run: node scripts/generate-hexcore-engine-manifest.test.cjs

      - name: Test runtime smoke controller
        run: node scripts/verify-hexcore-runtimes.test.cjs

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          npm install -g node-gyp
          npm install -g gulp-cli
          npm install -g tsx
          npm install -g prebuild-install

      - name: Install build gyp dependencies
        run: npm --prefix build/npm/gyp ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies first
        run: cd build && npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install extensions shared dependencies
        run: cd extensions && npm ci --ignore-scripts

      - name: Install extension dependencies
        run: |
          cd extensions/configuration-editing && npm ci --ignore-scripts
          cd ../css-language-features && npm ci --ignore-scripts
          cd ./server && npm ci --ignore-scripts
          cd ../../debug-auto-launch && npm ci --ignore-scripts
          cd ../debug-server-ready && npm ci --ignore-scripts
          cd ../emmet && npm ci --ignore-scripts
          cd ../extension-editing && npm ci --ignore-scripts
          cd ../git && npm ci --ignore-scripts
          cd ../git-base && npm ci --ignore-scripts
          cd ../github && npm ci --ignore-scripts
          cd ../github-authentication && npm ci --ignore-scripts
          cd ../grunt && npm ci --ignore-scripts
          cd ../gulp && npm ci --ignore-scripts
          cd ../html-language-features && npm ci --ignore-scripts
          cd ./server && npm ci --ignore-scripts
          cd ../../ipynb && npm ci --ignore-scripts
          cd ../jake && npm ci --ignore-scripts
          cd ../json-language-features && npm ci --ignore-scripts
          cd ./server && npm ci --ignore-scripts
          cd ../../markdown-language-features && npm ci --ignore-scripts
          cd ../markdown-math && npm ci --ignore-scripts
          cd ../media-preview && npm ci --ignore-scripts
          cd ../merge-conflict && npm ci --ignore-scripts
          cd ../mermaid-chat-features && npm ci --ignore-scripts
          cd ../microsoft-authentication && npm ci --ignore-scripts
          cd ../npm && npm ci --ignore-scripts
          cd ../php-language-features && npm ci --ignore-scripts
          cd ../references-view && npm ci --ignore-scripts
          cd ../search-result && npm ci --ignore-scripts
          cd ../simple-browser && npm ci --ignore-scripts
          cd ../terminal-suggest && npm ci --ignore-scripts
          cd ../tunnel-forwarding && npm ci --ignore-scripts
          cd ../typescript-language-features && npm ci --ignore-scripts

      - name: Fetch HexCore Native Prebuilds
        run: |
          cd extensions/hexcore-capstone && node ../../scripts/hexcore-native-install.js
          cd ../hexcore-unicorn && node ../../scripts/hexcore-native-install.js
          cd ../hexcore-llvm-mc && node ../../scripts/hexcore-native-install.js
          cd ../hexcore-better-sqlite3 && node ../../scripts/hexcore-native-install.js
          cd ../hexcore-remill && node ../../scripts/hexcore-native-install.js
          cd ../hexcore-souper && node ../../scripts/hexcore-native-install.js
          cd ../hexcore-elixir && node ../../scripts/hexcore-native-install.js

      - name: Verify Unicorn Runtime DLL
        continue-on-error: true
        run: |
          $unicornDir = "extensions/hexcore-unicorn"
          $dllPaths = @(
            "$unicornDir/deps/unicorn/unicorn.dll",
            "$unicornDir/prebuilds/win32-x64/unicorn.dll"
          )
          $found = $false
          foreach ($p in $dllPaths) {
            if (Test-Path $p) {
              $size = (Get-Item $p).Length / 1MB
              Write-Host "✓ unicorn.dll found at $p ($([math]::Round($size, 2)) MB)"
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host "✗ unicorn.dll NOT FOUND — emulation will fail at runtime"
            Write-Host "Attempting manual download from GitHub Release..."
            cd $unicornDir
            $version = node -p "require('./package.json').version"
            $tag = "v$version"
            New-Item -ItemType Directory -Force deps/unicorn | Out-Null
            gh release download $tag --repo AkashaCorporation/hexcore-unicorn --pattern "unicorn.dll" --dir deps/unicorn/ 2>$null
            if (Test-Path "deps/unicorn/unicorn.dll") {
              Write-Host "✓ unicorn.dll downloaded successfully"
            } else {
              Write-Host "⚠ Could not download unicorn.dll — Unicorn emulation will be unavailable in this build"
              Write-Host "⚠ This is non-blocking — the DLL can be added manually later"
            }
          }
          # Always exit 0 — DLL absence is non-fatal for the build
          exit 0

      - name: Fetch HexCore Helix Prebuilds (Windows)
        run: |
          cd extensions/hexcore-helix
          node ../../scripts/hexcore-native-install.js
          $nodeFile = "hexcore-helix.win32-x64-msvc.node"
          if (-not (Test-Path $nodeFile)) {
            throw "Required Helix prebuild is missing after install: $nodeFile"
          }

      - name: Fetch HexCore Remill Semantics
        run: |
          cd extensions/hexcore-remill
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $asset = "hexcore-remill-v$version-semantics-win32-x64.tar.gz"
          $url = "https://github.com/AkashaCorporation/hexcore-remill/releases/download/$tag/$asset"
          Write-Host "Downloading Remill semantics from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $asset
          tar -xzf $asset
          Remove-Item $asset
          Write-Host "Semantics installed:"
          Get-ChildItem deps/remill/share/semantics/ | Select-Object Name

      - name: Fetch HexCore Revenant Backend (Windows)
        run: |
          cd extensions/hexcore-revenant
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $asset = "revenant-engine-win-x64.tar.gz"
          $url = "https://github.com/AkashaCorporation/hexcore-revenant/releases/download/$tag/$asset"
          Write-Host "Downloading Revenant backend from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $asset
          New-Item -ItemType Directory -Force bin/win-x64 | Out-Null
          tar -xzf $asset -C bin/win-x64
          Remove-Item $asset
          if (-not (Test-Path bin/win-x64/revenant-engine.exe)) {
            throw "Revenant backend missing after extracting $asset"
          }
          Write-Host "Revenant backend installed: $((Get-Item bin/win-x64/revenant-engine.exe).Length) bytes"

      - name: Verify staged native runtimes before full build
        run: |
          node scripts/generate-hexcore-engine-manifest.cjs --app-root . --output "$env:RUNNER_TEMP/hexcore-staged-engines.json"
          if ($LASTEXITCODE -ne 0) { throw "Staged engine inventory failed" }
          node scripts/verify-hexcore-runtimes.cjs --app-root . --manifest "$env:RUNNER_TEMP/hexcore-staged-engines.json" --output "$env:RUNNER_TEMP/hexcore-staged-runtime-smoke.json"
          if ($LASTEXITCODE -ne 0) { throw "Staged engine loading failed" }

      - name: Compile HexCore Extensions
        env:
          npm_config_ignore_scripts: true
        run: |
          cd extensions/hexcore-hexviewer && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-peanalyzer && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-hashcalc && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-strings && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-entropy && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-base64 && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-filetype && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-common && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-ioc && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-yara && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-minidump && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-elfanalyzer && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-report-composer && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-disassembler && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-debugger && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-revenant && npm install --ignore-scripts && npm run compile
          cd ../hexcore-elixir && npm install --ignore-scripts && npm run compile
          cd ../hexcore-hql && npm ci --ignore-scripts && npm run build

      - name: Patch vsce npm resolver for local deps
        run: node scripts/patch-vsce-npm.js

      - name: Build VS Code
        run: npm run gulp vscode-win32-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged HexCore theme
        run: |
          $theme = "../VSCode-win32-x64/resources/app/extensions/theme-bathexcore/themes/hexcore-analysis-dark.json"
          if (-not (Test-Path $theme)) {
            throw "Required HexCore Analysis Dark theme is missing from the packaged app: $theme"
          }
          Get-Content $theme -Raw | ConvertFrom-Json | Out-Null

      - name: Generate packaged engine manifest
        run: |
          node scripts/generate-hexcore-engine-manifest.cjs `
            --app-root ../VSCode-win32-x64/resources/app `
            --output ../VSCode-win32-x64/resources/app/hexcore-engine-manifest.json

      - name: Create ZIP archive
        # Load checks run against resources/app, not the development checkout.
        # Analysis/emulation correctness is qualified by the separate acceptance corpus.
        run: |
          node scripts/verify-hexcore-runtimes.cjs `
            --app-root ../VSCode-win32-x64/resources/app `
            --manifest ../VSCode-win32-x64/resources/app/hexcore-engine-manifest.json `
            --output ../VSCode-win32-x64/resources/app/hexcore-runtime-smoke.json
          if ($LASTEXITCODE -ne 0) { throw "Packaged engine loading failed; refusing ZIP" }
          Compress-Archive -Path "../VSCode-win32-x64/*" -DestinationPath "HexCore-win32-x64.zip"

      - name: Validate ZIP created
        run: |
          if (-not (Test-Path "HexCore-win32-x64.zip")) { throw "ZIP missing" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexCore-win32-x64
          path: HexCore-win32-x64.zip

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: HexCore-win32-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"

      - name: Verify release identity
        run: node scripts/verify-hexcore-release.cjs

      - name: Test release identity
        run: node scripts/verify-hexcore-release.test.cjs

      - name: HexCore Preflight (Command/Build Coverage)
        run: node scripts/verify-hexcore-preflight.cjs

      - name: Test engine manifest
        run: node scripts/generate-hexcore-engine-manifest.test.cjs

      - name: Raise File Descriptor Limit
        run: ulimit -n 65535 || true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Install build tools
        run: |
          npm install -g node-gyp
          npm install -g gulp-cli
          npm install -g tsx
          npm install -g prebuild-install

      - name: Install build gyp dependencies
        run: npm --prefix build/npm/gyp ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies first
        run: cd build && npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install extensions shared dependencies
        run: cd extensions && npm ci --ignore-scripts

      - name: Install extension dependencies
        run: |
          cd extensions/configuration-editing && npm ci --ignore-scripts
          cd ../css-language-features && npm ci --ignore-scripts
          cd ./server && npm ci --ignore-scripts
          cd ../../debug-auto-launch && npm ci --ignore-scripts
          cd ../debug-server-ready && npm ci --ignore-scripts
          cd ../emmet && npm ci --ignore-scripts
          cd ../extension-editing && npm ci --ignore-scripts
          cd ../git && npm ci --ignore-scripts
          cd ../git-base && npm ci --ignore-scripts
          cd ../github && npm ci --ignore-scripts
          cd ../github-authentication && npm ci --ignore-scripts
          cd ../grunt && npm ci --ignore-scripts
          cd ../gulp && npm ci --ignore-scripts
          cd ../html-language-features && npm ci --ignore-scripts
          cd ./server && npm ci --ignore-scripts
          cd ../../ipynb && npm ci --ignore-scripts
          cd ../jake && npm ci --ignore-scripts
          cd ../json-language-features && npm ci --ignore-scripts
          cd ./server && npm ci --ignore-scripts
          cd ../../markdown-language-features && npm ci --ignore-scripts
          cd ../markdown-math && npm ci --ignore-scripts
          cd ../media-preview && npm ci --ignore-scripts
          cd ../merge-conflict && npm ci --ignore-scripts
          cd ../mermaid-chat-features && npm ci --ignore-scripts
          cd ../microsoft-authentication && npm ci --ignore-scripts
          cd ../npm && npm ci --ignore-scripts
          cd ../php-language-features && npm ci --ignore-scripts
          cd ../references-view && npm ci --ignore-scripts
          cd ../search-result && npm ci --ignore-scripts
          cd ../simple-browser && npm ci --ignore-scripts
          cd ../terminal-suggest && npm ci --ignore-scripts
          cd ../tunnel-forwarding && npm ci --ignore-scripts
          cd ../typescript-language-features && npm ci --ignore-scripts

      - name: Fetch HexCore Native Dependencies
        run: |
          cd extensions/hexcore-better-sqlite3 && node ../../scripts/hexcore-native-install.js

      - name: Fetch HexCore Remill Prebuilds (Linux)
        continue-on-error: true
        run: |
          cd extensions/hexcore-remill && node ../../scripts/hexcore-native-install.js

      - name: Fetch HexCore Souper Prebuilds (Linux)
        continue-on-error: true
        run: |
          cd extensions/hexcore-souper && node ../../scripts/hexcore-native-install.js

      - name: Fetch HexCore Helix Prebuilds (Linux)
        continue-on-error: true
        run: |
          cd extensions/hexcore-helix && node ../../scripts/hexcore-native-install.js

      - name: Fetch HexCore Elixir Prebuilds (Linux)
        continue-on-error: true
        run: |
          cd extensions/hexcore-elixir && node ../../scripts/hexcore-native-install.js

      - name: Fetch HexCore Remill Semantics (Linux)
        continue-on-error: true
        run: |
          cd extensions/hexcore-remill
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          asset="hexcore-remill-v${version}-semantics-win32-x64.tar.gz"
          url="https://github.com/AkashaCorporation/hexcore-remill/releases/download/${tag}/${asset}"
          echo "Downloading Remill semantics from ${url} ..."
          curl -fsSL -o "${asset}" "${url}" || { echo "Semantics not available for Linux yet"; exit 0; }
          tar -xzf "${asset}"
          rm -f "${asset}"
          echo "Semantics installed:"
          ls deps/remill/share/semantics/

      - name: Fetch HexCore Revenant Backend (Linux)
        run: |
          cd extensions/hexcore-revenant
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          asset="revenant-engine-linux-x64.tar.gz"
          url="https://github.com/AkashaCorporation/hexcore-revenant/releases/download/${tag}/${asset}"
          echo "Downloading Revenant backend from ${url} ..."
          curl -fsSL -o "${asset}" "${url}"
          mkdir -p bin/linux-x64
          tar -xzf "${asset}" -C bin/linux-x64
          rm -f "${asset}"
          test -x bin/linux-x64/revenant-engine || { echo "Revenant backend missing after extraction"; exit 1; }

      - name: Compile HexCore Extensions
        run: |
          cd extensions/hexcore-hexviewer && npm ci && npm run compile
          cd ../hexcore-peanalyzer && npm ci && npm run compile
          cd ../hexcore-hashcalc && npm ci && npm run compile
          cd ../hexcore-strings && npm ci && npm run compile
          cd ../hexcore-entropy && npm ci && npm run compile
          cd ../hexcore-base64 && npm ci && npm run compile
          cd ../hexcore-filetype && npm ci && npm run compile
          cd ../hexcore-common && npm ci && npm run compile
          cd ../hexcore-ioc && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-yara && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-minidump && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-elfanalyzer && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-report-composer && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-disassembler && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-debugger && npm ci --ignore-scripts && npm run compile
          cd ../hexcore-revenant && npm install --ignore-scripts && npm run compile
          cd ../hexcore-elixir && npm install --ignore-scripts && npm run compile
          cd ../hexcore-hql && npm ci --ignore-scripts && npm run build

      - name: Patch vsce npm resolver for local deps
        run: node scripts/patch-vsce-npm.js

      - name: Build VS Code
        run: npm run gulp vscode-linux-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create TAR.GZ archive
        run: |
          tar -czvf HexCore-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexCore-linux-x64
          path: HexCore-linux-x64.tar.gz

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: HexCore-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
