name: HexCore Native Prebuilds

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22.21.1"

jobs:
  prebuild-windows:
    name: Build Native Prebuilds (Windows)
    # windows-latest now ships Visual Studio 18 (2026), which node-gyp 10.3.1
    # cannot parse ("unknown version undefined"). Pin to windows-2022 (VS 2022,
    # fully supported). Follow-up when 2022 retires: upgrade node-gyp for VS 18.
    runs-on: windows-2022
    env:
      HEXCORE_RELEASE_TOKEN: ${{ secrets.HEXCORE_RELEASE_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        engine:
          - name: hexcore-capstone
            repo: AkashaCorporation/hexcore-capstone
          - name: hexcore-unicorn
            repo: AkashaCorporation/hexcore-unicorn
          - name: hexcore-llvm-mc
            repo: AkashaCorporation/hexcore-llvm-mc
          - name: hexcore-better-sqlite3
            repo: AkashaCorporation/hexcore-better-sqlite3
          - name: hexcore-remill
            repo: AkashaCorporation/hexcore-remill
            deps_asset: remill-deps-win32-x64.zip
            deps_tag: v0.5.1
          - name: hexcore-souper
            repo: AkashaCorporation/hexcore-souper
            deps_asset: souper-deps-win32-x64.zip
            deps_tag: v0.1.0
          # NOTE: hexcore-elixir is NOT in this matrix. Elixir uses NAPI-RS + Rust
          # (like Helix), not node-gyp + prebuildify. It has its own dedicated job
          # below: prebuild-elixir-windows (mirroring prebuild-helix-windows).
    steps:
      - name: Checkout Engine Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.engine.repo }}
          ref: main
          path: engine

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup MSVC dev environment (node-gyp VS detection on VS 18 runners)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch LLVM deps (hexcore-llvm-mc)
        if: ${{ matrix.engine.name == 'hexcore-llvm-mc' }}
        run: |
          $tag = "v1.0.0"
          $asset = "llvm-win32-x64.zip"
          $url = "https://github.com/AkashaCorporation/hexcore-llvm-mc/releases/download/$tag/$asset"
          Invoke-WebRequest -Uri $url -OutFile $asset
          New-Item -ItemType Directory -Force engine/deps/llvm | Out-Null
          Expand-Archive -Path $asset -DestinationPath engine/deps/llvm

      - name: Fetch Remill deps (hexcore-remill)
        if: ${{ matrix.engine.name == 'hexcore-remill' && matrix.engine.deps_asset }}
        run: |
          $tag = "${{ matrix.engine.deps_tag }}"
          $asset = "${{ matrix.engine.deps_asset }}"
          $url = "https://github.com/${{ matrix.engine.repo }}/releases/download/$tag/$asset"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest -Uri $url -OutFile $asset
          Expand-Archive -Path $asset -DestinationPath engine -Force
          Remove-Item $asset

      - name: Fetch Souper deps (hexcore-souper)
        if: ${{ matrix.engine.name == 'hexcore-souper' && matrix.engine.deps_asset }}
        run: |
          $tag = "${{ matrix.engine.deps_tag }}"
          $asset = "${{ matrix.engine.deps_asset }}"
          $url = "https://github.com/${{ matrix.engine.repo }}/releases/download/$tag/$asset"
          Write-Host "Downloading $url ..."
          Invoke-WebRequest -Uri $url -OutFile $asset
          Expand-Archive -Path $asset -DestinationPath engine -Force
          Remove-Item $asset

          # The historical v0.1.0 dependency bundle predates the external
          # solver executable. Pin and verify the official runtime so both the
          # native Souper bridge and the headless model API can invoke Z3.
          $z3Exe = "engine/deps/z3/z3.exe"
          $z3Dll = "engine/deps/z3/libz3.dll"
          if (-not (Test-Path $z3Exe) -or -not (Test-Path $z3Dll)) {
            $z3Version = "4.16.0"
            $z3Asset = "z3-$z3Version-x64-win.zip"
            $z3Url = "https://github.com/Z3Prover/z3/releases/download/z3-$z3Version/$z3Asset"
            $z3Temp = Join-Path $env:RUNNER_TEMP "hexcore-z3"
            Remove-Item -LiteralPath $z3Temp -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $z3Temp | Out-Null
            Invoke-WebRequest -Uri $z3Url -OutFile (Join-Path $z3Temp $z3Asset)
            Expand-Archive -Path (Join-Path $z3Temp $z3Asset) -DestinationPath $z3Temp -Force
            $downloadedExe = Get-ChildItem -Path $z3Temp -Recurse -Filter z3.exe | Select-Object -First 1
            $downloadedDll = Get-ChildItem -Path $z3Temp -Recurse -Filter libz3.dll | Select-Object -First 1
            if (-not $downloadedExe -or -not $downloadedDll) {
              throw "Official Z3 runtime is incomplete: $z3Url"
            }
            New-Item -ItemType Directory -Force engine/deps/z3 | Out-Null
            Copy-Item -LiteralPath $downloadedExe.FullName -Destination $z3Exe -Force
            Copy-Item -LiteralPath $downloadedDll.FullName -Destination $z3Dll -Force
          }

          $expectedZ3Hash = "469DE2006052E73177412986AE947E82E102984D467EF5430ACA8C84E1ADB23E"
          $actualZ3Hash = (Get-FileHash -LiteralPath $z3Exe -Algorithm SHA256).Hash
          if ($actualZ3Hash -ne $expectedZ3Hash) {
            throw "Unexpected Z3 executable hash: $actualZ3Hash"
          }

      - name: Install Dependencies
        working-directory: engine
        run: npm ci --ignore-scripts

      - name: Build Prebuilds
        working-directory: engine
        run: |
          if ("${{ matrix.engine.name }}" -eq "hexcore-souper") {
            npm run package:prebuild
          } else {
            npm run prebuild
          }

      - name: Bundle Souper Z3 Runtime
        if: ${{ matrix.engine.name == 'hexcore-souper' }}
        working-directory: engine
        run: |
          $runtimeFiles = @("libz3.dll", "z3.exe")
          foreach ($runtimeFile in $runtimeFiles) {
            $source = "deps/z3/$runtimeFile"
            $destination = "prebuilds/win32-x64/$runtimeFile"
            if (-not (Test-Path $source)) {
              throw "Souper runtime not found: $source"
            }
            New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination -Force
            Write-Host "Bundled Souper runtime: $destination"
          }

      - name: Read Engine Version
        id: engine-version
        working-directory: engine
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Read N-API Version
        id: napi-version
        working-directory: engine
        run: |
          $napi = node -p "((require('./package.json').binary || {}).napi_versions || [8])[0]"
          "napi=$napi" >> $env:GITHUB_OUTPUT

      - name: Pack Prebuilds
        id: pack-prebuilds
        working-directory: engine
        run: |
          $name = node -p "require('./package.json').name"
          $version = "${{ steps.engine-version.outputs.version }}"
          $napi = "${{ steps.napi-version.outputs.napi }}"
          $asset = "$name-v$version-napi-v$napi-win32-x64.tar.gz"
          if (-not (Test-Path prebuilds)) {
            throw "prebuilds/ directory not found"
          }
          tar -czf $asset prebuilds
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Pack Unicorn Runtime DLLs
        id: pack-runtime
        if: ${{ matrix.engine.name == 'hexcore-unicorn' }}
        working-directory: engine
        run: |
          $version = "${{ steps.engine-version.outputs.version }}"
          $name = "hexcore-unicorn"
          $runtimeAsset = "$name-v$version-runtime-win32-x64.tar.gz"
          $dllPath = "deps/unicorn/unicorn.dll"
          if (Test-Path $dllPath) {
            tar -czf $runtimeAsset $dllPath
            "asset=$runtimeAsset" >> $env:GITHUB_OUTPUT
            Write-Host "Packed Unicorn runtime DLL: $runtimeAsset"
          } else {
            Write-Host "WARNING: unicorn.dll not found at $dllPath — runtime asset skipped"
          }

      - name: Pack Remill Semantics
        id: pack-semantics
        if: ${{ matrix.engine.name == 'hexcore-remill' }}
        working-directory: engine
        run: |
          $version = "${{ steps.engine-version.outputs.version }}"
          $semanticsDir = "deps/remill/share/semantics"
          if (-not (Test-Path $semanticsDir)) {
            throw "Semantics directory not found: $semanticsDir"
          }
          $asset = "hexcore-remill-v$version-semantics-win32-x64.tar.gz"
          tar -czf $asset $semanticsDir
          "asset=$asset" >> $env:GITHUB_OUTPUT
          Write-Host "Packed semantics: $asset"

      - name: Upload Prebuild Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.engine.name }}-prebuilds-win32
          path: |
            engine/prebuilds/**
            engine/${{ steps.pack-prebuilds.outputs.asset }}

      - name: Upload Semantics Artifact
        if: ${{ matrix.engine.name == 'hexcore-remill' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.engine.name }}-semantics-win32
          path: engine/${{ steps.pack-semantics.outputs.asset }}

      - name: Upload Prebuilds to Release
        if: ${{ env.HEXCORE_RELEASE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.HEXCORE_RELEASE_TOKEN }}
          GH_REPO: ${{ matrix.engine.repo }}
          ENGINE_VERSION: ${{ steps.engine-version.outputs.version }}
        run: |
          $tag = "v$env:ENGINE_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Automated native prebuilds for $env:ENGINE_VERSION"
          }
          $asset = "engine/${{ steps.pack-prebuilds.outputs.asset }}"
          if (-not (Test-Path $asset)) {
            throw "Prebuild package not found: $asset"
          }
          gh release upload $tag $asset --clobber

      - name: Upload Unicorn Runtime DLLs to Release
        if: ${{ matrix.engine.name == 'hexcore-unicorn' && env.HEXCORE_RELEASE_TOKEN != '' && steps.pack-runtime.outputs.asset }}
        env:
          GH_TOKEN: ${{ env.HEXCORE_RELEASE_TOKEN }}
          GH_REPO: ${{ matrix.engine.repo }}
          ENGINE_VERSION: ${{ steps.engine-version.outputs.version }}
        run: |
          $tag = "v$env:ENGINE_VERSION"
          $asset = "engine/${{ steps.pack-runtime.outputs.asset }}"
          if (Test-Path $asset) {
            gh release upload $tag $asset --clobber
            Write-Host "Uploaded Unicorn runtime DLL asset"
          }
          # Also upload the raw DLL for fallback download
          $dll = "engine/deps/unicorn/unicorn.dll"
          if (Test-Path $dll) {
            gh release upload $tag $dll --clobber
            Write-Host "Uploaded unicorn.dll as standalone asset"
          }

      - name: Upload Semantics to Release
        if: ${{ matrix.engine.name == 'hexcore-remill' && env.HEXCORE_RELEASE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.HEXCORE_RELEASE_TOKEN }}
          GH_REPO: ${{ matrix.engine.repo }}
          ENGINE_VERSION: ${{ steps.engine-version.outputs.version }}
        run: |
          $tag = "v$env:ENGINE_VERSION"
          $asset = "engine/${{ steps.pack-semantics.outputs.asset }}"
          if (-not (Test-Path $asset)) {
            throw "Semantics package not found: $asset"
          }
          gh release upload $tag $asset --clobber

  # All active prebuildify engines (Capstone, Unicorn, LLVM-MC, SQLite, Remill,
  # and Souper) are in the main prebuild matrix above. Rellic remains disabled.

  # ---------------------------------------------------------------------------
  # Helix — NAPI-RS build (separate job, requires LLVM 18 + MLIR)
  # ---------------------------------------------------------------------------
  prebuild-helix-windows:
    name: Build Helix NAPI-RS (Windows)
    runs-on: windows-latest
    env:
      HEXCORE_RELEASE_TOKEN: ${{ secrets.HEXCORE_RELEASE_TOKEN }}
    steps:
      - name: Checkout Helix Repository
        uses: actions/checkout@v6
        with:
          repository: AkashaCorporation/HexCore-Helix
          ref: main
          path: engine

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NAPI-RS CLI
        run: npm install -g @napi-rs/cli

      - name: Cache Helix LLVM/MLIR Deps
        id: cache-helix-deps
        uses: actions/cache@v4
        with:
          path: engine/engine/deps/llvm-mlir
          key: helix-llvm-mlir-win32-x64-bc05a44b7b9860ca2a257516e0d1d744f87720badda5a5bef587b4f87f9908b7

      - name: Download Helix LLVM/MLIR Deps
        if: steps.cache-helix-deps.outputs.cache-hit != 'true'
        working-directory: engine/engine
        run: |
          $version = node -p "require('../package.json').version"
          $tag = "v$version"
          $asset = "helix-llvm-mlir-deps-win32-x64.zip"
          $url = "https://github.com/AkashaCorporation/HexCore-Helix/releases/download/$tag/$asset"
          Write-Host "Downloading Helix LLVM/MLIR deps from $url (tag: $tag) ..."

          $maxRetries = 3
          $retryCount = 0
          $success = $false

          while (-not $success -and $retryCount -lt $maxRetries) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $asset -TimeoutSec 600
              $success = $true
            } catch {
              $retryCount++
              Write-Host "Download failed (attempt $retryCount/$maxRetries): $_"
              if ($retryCount -lt $maxRetries) {
                Write-Host "Retrying in 10 seconds..."
                Start-Sleep -Seconds 10
              } else {
                throw "Failed to download after $maxRetries attempts"
              }
            }
          }

          $expectedHash = 'BC05A44B7B9860CA2A257516E0D1D744F87720BADDA5A5BEF587B4F87F9908B7'
          if ((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Helix dependency bundle hash mismatch'
          }
          New-Item -ItemType Directory -Force deps | Out-Null
          Expand-Archive -Path $asset -DestinationPath deps -Force
          Remove-Item $asset

      - name: Verify Engine Lib
        working-directory: engine/engine
        run: |
          $provenance = Get-Content -Raw deps/llvm-mlir/engine/build-provenance.json | ConvertFrom-Json
          $sourceTree = git rev-parse HEAD:engine
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve Helix engine source tree' }
          $packageVersion = node -p "require('../package.json').version"
          if ($provenance.engineSourceTree -ne $sourceTree.Trim() -or $provenance.packageVersion -ne $packageVersion) {
            throw 'Prebuilt Helix C++ engine does not match the checked-out source/version'
          }
          $libPath = "deps/llvm-mlir/engine/helix_engine.lib"
          if ((Get-FileHash -LiteralPath $libPath -Algorithm SHA256).Hash -ne $provenance.engineLibrarySha256) {
            throw 'Prebuilt Helix C++ engine hash mismatch'
          }
          if (Test-Path $libPath) {
            $size = (Get-Item $libPath).Length / 1MB
            Write-Host "✓ helix_engine.lib found: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "✗ helix_engine.lib NOT FOUND at $libPath"
            Write-Host "Deps directory contents:"
            if (Test-Path "deps") {
              Get-ChildItem deps -Recurse -Filter "*.lib" | Select-Object FullName
            }
            exit 1
          }

      - name: Install Dependencies
        working-directory: engine
        run: npm ci --ignore-scripts

      - name: Build NAPI-RS Module
        working-directory: engine
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/engine/engine/deps/llvm-mlir/lib
          HELIX_ENGINE_LIB: ${{ github.workspace }}/engine/engine/deps/llvm-mlir/engine
        run: npm run build

      - name: Read Engine Version
        id: engine-version
        working-directory: engine
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Locate and Pack NAPI-RS Binary
        id: pack-napi
        working-directory: engine
        run: |
          $version = "${{ steps.engine-version.outputs.version }}"
          $binaryName = node -p "require('./package.json').napi.binaryName"
          $nodeFile = "$binaryName.win32-x64-msvc.node"
          # NAPI-RS may output to cwd or crates/hexcore-helix/
          $candidates = @(
            "$nodeFile",
            "crates/hexcore-helix/$nodeFile"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $found = $c; break }
          }
          if (-not $found) {
            throw "NAPI-RS .node file not found. Searched: $($candidates -join ', ')"
          }
          # Copy to root for upload
          if ($found -ne $nodeFile) {
            Copy-Item $found $nodeFile
          }
          # Pack as tar.gz for release (same pattern as prebuildify engines)
          $asset = "$binaryName-v$version-napi-win32-x64.node"
          Copy-Item $nodeFile $asset
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "nodeFile=$nodeFile" >> $env:GITHUB_OUTPUT
          Write-Host "Packed NAPI-RS binary: $asset ($(Get-Item $asset | Select-Object -ExpandProperty Length) bytes)"

      - name: Upload NAPI-RS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexcore-helix-napi-win32
          path: |
            engine/${{ steps.pack-napi.outputs.asset }}

      - name: Upload NAPI-RS Binary to Release
        if: ${{ env.HEXCORE_RELEASE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.HEXCORE_RELEASE_TOKEN }}
          GH_REPO: AkashaCorporation/HexCore-Helix
          ENGINE_VERSION: ${{ steps.engine-version.outputs.version }}
        run: |
          $tag = "v$env:ENGINE_VERSION"
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArgs = @('release', 'create', $tag, '--repo', $env:GH_REPO, '--target', 'main', '--title', $tag, '--notes', "Automated NAPI-RS prebuilds for Helix $env:ENGINE_VERSION")
            if ($env:ENGINE_VERSION.Contains('-')) { $releaseArgs += '--prerelease' }
            gh @releaseArgs
          }
          $asset = "engine/${{ steps.pack-napi.outputs.asset }}"
          if (-not (Test-Path $asset)) {
            throw "NAPI-RS binary not found: $asset"
          }
          gh release upload $tag $asset --repo $env:GH_REPO --clobber

  # ---------------------------------------------------------------------------
  # Elixir — NAPI-RS build (separate job, Project Azoth clean-room emulator)
  # Mirrors the Helix pattern above: NAPI-RS + Rust + vendored hexcore-unicorn
  # dependency. Deps zip (elixir-deps-win32-x64.zip) contains the vendored
  # hexcore-unicorn headers/libs/DLL that the engine CMake build consumes.
  # ---------------------------------------------------------------------------
  prebuild-elixir-windows:
    name: Build Elixir NAPI-RS (Windows)
    runs-on: windows-2022
    env:
      HEXCORE_RELEASE_TOKEN: ${{ secrets.HEXCORE_RELEASE_TOKEN }}
    steps:
      - name: Checkout Elixir Repository
        uses: actions/checkout@v6
        with:
          repository: AkashaCorporation/HexCore-Elixir
          ref: main
          path: engine

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NAPI-RS CLI
        run: npm install -g @napi-rs/cli

      - name: Cache Elixir vendored Unicorn dependencies
        id: cache-elixir-deps
        uses: actions/cache@v4
        with:
          path: engine/deps
          key: elixir-deps-win32-x64-610a5416870d4cfd69e1bf881ef4d6fca588793d8feb85ac49126ec42e44bdba

      - name: Download Elixir Deps
        if: steps.cache-elixir-deps.outputs.cache-hit != 'true'
        working-directory: engine
        run: |
          # The vendor bundle has its own version. Rebuild Elixir's C++ below.
          $tag = 'v1.0.3'
          $asset = "elixir-deps-win32-x64.zip"
          $url = "https://github.com/AkashaCorporation/HexCore-Elixir/releases/download/$tag/$asset"
          Write-Host "Downloading Elixir deps from $url (tag: $tag) ..."

          $maxRetries = 3
          $retryCount = 0
          $success = $false

          while (-not $success -and $retryCount -lt $maxRetries) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $asset -TimeoutSec 300
              $success = $true
            } catch {
              $retryCount++
              Write-Host "Download failed (attempt $retryCount/$maxRetries): $_"
              if ($retryCount -lt $maxRetries) {
                Write-Host "Retrying in 10 seconds..."
                Start-Sleep -Seconds 10
              } else {
                throw "Failed to download after $maxRetries attempts"
              }
            }
          }

          $expectedHash = '610A5416870D4CFD69E1BF881EF4D6FCA588793D8FEB85AC49126EC42E44BDBA'
          if ((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Elixir dependency bundle hash mismatch'
          }
          Expand-Archive -Path $asset -DestinationPath . -Force
          Remove-Item $asset

      - name: Verify vendored hexcore-unicorn
        working-directory: engine
        run: |
          $headerPath = "deps/hexcore-unicorn/include/unicorn/unicorn.h"
          $libPath = "deps/hexcore-unicorn/lib/unicorn-import.lib"
          $dllPath = "deps/hexcore-unicorn/bin/unicorn.dll"
          $missing = $false
          foreach ($p in @($headerPath, $libPath, $dllPath)) {
            if (Test-Path $p) {
              $size = (Get-Item $p).Length / 1KB
              Write-Host "✓ $p ($([math]::Round($size, 2)) KB)"
            } else {
              Write-Host "✗ $p NOT FOUND"
              $missing = $true
            }
          }
          if ($missing) { exit 1 }

      - name: Build current Elixir C++ engine
        working-directory: engine
        run: |
          cmake -S engine -B engine/ci-build -G "Visual Studio 17 2022" -A x64 -DELIXIR_BUILD_CLI=OFF -DELIXIR_BUILD_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Elixir CMake configure failed' }
          cmake --build engine/ci-build --config Release --target elixir_engine --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Elixir C++ build failed' }
          New-Item -ItemType Directory -Force engine/build/Release | Out-Null
          Copy-Item -LiteralPath engine/ci-build/Release/elixir_engine.lib -Destination engine/build/Release/elixir_engine.lib -Force
          Get-FileHash -LiteralPath engine/build/Release/elixir_engine.lib -Algorithm SHA256

      - name: Install Dependencies
        working-directory: engine
        run: npm ci --ignore-scripts

      - name: Build NAPI-RS Module
        working-directory: engine
        run: npm run build

      - name: Read Engine Version
        id: engine-version
        working-directory: engine
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Locate and Pack NAPI-RS Binary
        id: pack-napi
        working-directory: engine
        run: |
          $version = "${{ steps.engine-version.outputs.version }}"
          $binaryName = node -p "require('./package.json').napi.binaryName"
          $nodeFile = "$binaryName.win32-x64-msvc.node"
          # NAPI-RS may output to cwd or crates/hexcore-elixir/
          $candidates = @(
            "$nodeFile",
            "crates/hexcore-elixir/$nodeFile"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $found = $c; break }
          }
          if (-not $found) {
            throw "NAPI-RS .node file not found. Searched: $($candidates -join ', ')"
          }
          # Copy to root for upload
          if ($found -ne $nodeFile) {
            Copy-Item $found $nodeFile
          }
          $asset = "$binaryName-v$version-napi-win32-x64.node"
          Copy-Item $nodeFile $asset
          "asset=$asset" >> $env:GITHUB_OUTPUT
          "nodeFile=$nodeFile" >> $env:GITHUB_OUTPUT
          Write-Host "Packed NAPI-RS binary: $asset ($(Get-Item $asset | Select-Object -ExpandProperty Length) bytes)"

      - name: Upload NAPI-RS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hexcore-elixir-napi-win32
          path: |
            engine/${{ steps.pack-napi.outputs.asset }}

      - name: Upload NAPI-RS Binary to Release
        if: ${{ env.HEXCORE_RELEASE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.HEXCORE_RELEASE_TOKEN }}
          GH_REPO: AkashaCorporation/HexCore-Elixir
          ENGINE_VERSION: ${{ steps.engine-version.outputs.version }}
        run: |
          $tag = "v$env:ENGINE_VERSION"
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GH_REPO --title $tag --notes "Automated NAPI-RS prebuilds for Elixir $env:ENGINE_VERSION (Project Azoth)"
          }
          $asset = "engine/${{ steps.pack-napi.outputs.asset }}"
          if (-not (Test-Path $asset)) {
            throw "NAPI-RS binary not found: $asset"
          }
          gh release upload $tag $asset --repo $env:GH_REPO --clobber
